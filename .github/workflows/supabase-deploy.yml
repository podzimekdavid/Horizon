name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      target:
        description: Hosted environment
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      HORIZON_AUTH_SITE_URL: ${{ secrets.HORIZON_AUTH_SITE_URL }}
      HORIZON_AUTH_ADDITIONAL_REDIRECT_URL: ${{ secrets.HORIZON_AUTH_ADDITIONAL_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/supabase-deploy.sh
