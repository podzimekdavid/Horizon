# Applies the Horizon event log after Auth has migrated its schema.

services:
  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      HORIZON_SEED: ${HORIZON_SEED:-false}
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ../supabase/seed.sql:/seed.sql:ro
      - ./horizon/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]

  rest:
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Supavisor's limits.sh runs `ulimit -n 100000` and exits when the container's hard limit is lower
  # (GitHub runners), which crash-loops the pooler and fails `up --wait`. Grant the limit up front.
  supavisor:
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

  auth:
    environment:
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "true"

  web:
    build:
      context: ../apps/web
    image: horizon-web
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
